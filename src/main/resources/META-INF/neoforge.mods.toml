modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="CIRCLESTAR523"
description="""
Client-side compatibility layer that restores EMI Recipe Tree crafting-mode
slot highlights in Sophisticated Storage and Sophisticated Backpacks screens.
"""

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="emi"
type="required"
versionRange="[1.1.24,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="sophisticatedcore"
type="optional"
versionRange="[1.4.60,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="sophisticatedstorage"
type="optional"
versionRange="[1.5.63,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="sophisticatedbackpacks"
type="optional"
versionRange="[3.25.64,)"
ordering="AFTER"
side="CLIENT"

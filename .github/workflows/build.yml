name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Generate wrapper if missing
        run: test -f gradlew || gradle wrapper
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build
        run: ./gradlew clean build --no-configuration-cache --no-build-cache --no-parallel --project-prop=neogradle.subsystems.decompiler.enabled=false --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: emi-highlights-plus
          path: build/libs/*.jar
